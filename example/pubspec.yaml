publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  webview_modal_guard:
    path: ..
  webview_key_guard:
