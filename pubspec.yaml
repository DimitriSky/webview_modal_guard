name: webview_modal_guard
description: Window-scoped native input isolation for Flutter modal routes over macOS WebViews.
version: 0.1.0
repository: https://github.com/DimitriSky/webview_modal_guard
publish_to: none
environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WebviewModalGuardPlugin
        dartPluginClass: WebViewModalGuardPlugin
